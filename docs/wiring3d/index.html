<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microduck 接线图 3D</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--acc:#0071e3;--warn:#b25000;--warnbg:#fff4e5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161618;--panel:#232326;--ink:#f5f5f7;--sub:#a1a1a6;--line:#3a3a3e;--acc:#2997ff;--warn:#ffb457;--warnbg:#3a2a10}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{padding:10px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header span{color:var(--sub);font-size:12px}
main{flex:1;min-height:0;display:flex;gap:12px;padding:0 12px 12px}
#side{width:340px;flex:none;background:var(--panel);border-radius:14px;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line)}
#steps{overflow:auto;padding:8px;flex:1;min-height:0}
.step{display:flex;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;align-items:flex-start}
.step:hover{background:rgba(127,127,127,.1)}
.step.on{background:var(--acc);color:#fff}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(127,127,127,.2);font-size:12px;display:grid;place-items:center;font-weight:600}
.step.on .n{background:rgba(255,255,255,.28)}
.step b{display:block;font-weight:600}
.step small{opacity:.75;font-size:12px}
#info{border-top:1px solid var(--line);padding:12px 14px;max-height:42%;overflow:auto;font-size:13px}
#info h3{margin:0 0 6px;font-size:14px}
#info ul{margin:0;padding-left:18px}
#info li{margin:3px 0}
#info .warn{margin-top:8px;padding:7px 9px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:12px}
table.pin{border-collapse:collapse;margin:6px 0;font-size:12px}
table.pin td,table.pin th{border:1px solid var(--line);padding:2px 8px;text-align:center}
#stage{flex:1;min-width:0;position:relative;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.88);color:#1d1d1f;border:1px solid rgba(0,0,0,.15);transition:opacity .2s}
.lb.des{background:#0071e3;color:#fff;border:0;font-weight:600;font-size:11px}
.lb.sid{background:#ff9f0a;color:#1d1d1f;border:0;font-weight:700;border-radius:50%;padding:1px 5px}
.lb.dim{opacity:.18}
#tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
#tools label{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
#tools input{margin-right:4px;vertical-align:-1px}
#hint{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--sub);text-align:right;max-width:60%}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);background:var(--panel);transition:opacity .4s}
#credit{padding:0 16px 10px;font-size:11px;color:var(--sub)}
@media (max-width:820px){main{flex-direction:column-reverse}#side{width:auto;height:46%}#stage{height:54%;flex:none}}
</style>
</head>
<body>
<header><h1>Microduck 接线图（3D）</h1><span>拖动旋转 · 滚轮缩放 · 右键平移 · 点零件或左边步骤高亮对应线路</span></header>
<main>
  <div id="side"><div id="steps"></div><div id="info"></div></div>
  <div id="stage">
    <canvas id="cv"></canvas><div id="labels"></div>
    <div id="tools">
      <label><input type="checkbox" id="tShell" checked>外壳</label>
      <label><input type="checkbox" id="tMech" checked>机械件</label>
      <label><input type="checkbox" id="tWires" checked>线</label>
      <label><input type="checkbox" id="tIds" checked>舵机编号</label>
      <label><input type="checkbox" id="tDes" checked>接口位号</label>
      <label><input type="checkbox" id="tName" checked>名称</label>
      <label><input type="checkbox" id="tAll">全部显示</label>
    </div>
    <div id="hint">鸭子是站姿；线的颜色仅作区分，HUB 的前后位置为示意</div>
    <div id="load">正在加载模型…</div>
  </div>
</main>
<div id="credit">IMU 小板：本项目自研　HUB、香蕉板：社区开源设计（Apache-2.0）　HAT：Pollen Robotics 开源设计　主控：Radxa ZERO 3W</div>

<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
