[Unit]
Wants=mediad.service
After=mediad.service

[Service]
ExecStart=
ExecStart=/opt/microduck-studio/python/bin/python3.13 -I run.py --listen 0.0.0.0:8000 --state-dir /var/lib/microduck-studio --log-dir /var/log/microduck-studio --configd none --tof none --camera-socket unix:/run/mediad/media.sock
